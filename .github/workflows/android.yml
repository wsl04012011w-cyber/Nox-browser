name: Android Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Nox debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore uploaded project bundle
        id: source_bundle
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G ".nox-source/part-*.b64" > /dev/null; then
            cp .github/workflows/android.yml "$RUNNER_TEMP/nox-android.yml"
            bundle="$RUNNER_TEMP/Nox-browser.zip"
            unpack="$RUNNER_TEMP/nox-import"
            mkdir -p "$unpack"
            cat .nox-source/part-*.b64 | tr -d '\r\n' | base64 --decode > "$bundle"
            unzip -q "$bundle" -d "$unpack"
            project="$unpack/Nox-browser"
            test -f "$project/app/src/main/java/com/nox/browser/MainActivity.kt"
            cp -a "$project/." .
            cp "$RUNNER_TEMP/nox-android.yml" .github/workflows/android.yml
            rm -rf .nox-source
            echo "imported=true" >> "$GITHUB_OUTPUT"
          else
            echo "imported=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit imported source after a successful build
        if: success() && steps.source_bundle.outputs.imported == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Import reviewed Nox Browser project source"
            git push
          fi
